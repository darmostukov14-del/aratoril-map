<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Араторил — Карта Искателей</title>
    
    <!-- Telegram WebApp script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        
        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
            padding: 16px 16px 40px;
            pointer-events: none;
        }
        
        .top-bar h1 {
            font-size: 18px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        
        .top-bar .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }
        
        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(15, 15, 30, 0.92);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-top: 1px solid rgba(255, 200, 80, 0.3);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .stat-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #ffc850;
        }
        
        .stat-item .label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #c9a227, #e8c547);
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s;
        }
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Кастомные маркеры */
        .scroll-marker {
            background: radial-gradient(circle, #ffc850 30%, #c9a227 70%);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(255, 200, 80, 0.8);
        }
        
        .fog-info {
            text-align: center;
            font-size: 13px;
            margin-bottom: 10px;
            color: #a0c4ff;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>⚔️ Араторил</h1>
        <div class="subtitle">Карта Искателей Рассвета</div>
    </div>
    
    <div id="map"></div>
    
    <div class="bottom-panel">
        <div class="fog-info" id="fogStatus">Туман всё ещё держится над городом...</div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="value" id="pointsCount">0</div>
                <div class="label">Свитков</div>
            </div>
            <div class="stat-item">
                <div class="value" id="fogPercent">100%</div>
                <div class="label">Сила Тумана</div>
            </div>
        </div>
        
        <button class="btn" id="addPointBtn" onclick="addCurrentLocation()">
            📍 Оставить Свиток здесь
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Координаты центра Армавира / Араторила
        const ARATORIL_CENTER = [44.997655, 41.129644];
        
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // Подстраиваем цвета под тему Telegram
            document.body.style.setProperty('--tg-theme-bg', tg.themeParams.bg_color || '#1a1a2e');
        }
        
        // Создаём карту
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView(ARATORIL_CENTER, 14);
        
        // Тёмный стиль карты (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);
        
        // Контроль зума
        L.control.zoom({ position: 'topright' }).addTo(map);
        
        // Хранилище точек (пока в памяти, потом будет с сервера)
        let points = [];
        let markersLayer = L.layerGroup().addTo(map);
        
        // Загружаем точки (в будущем — с бэкенда)
        function loadPoints() {
            // Пример: можно будет передавать initData от бота
            const saved = localStorage.getItem('aratoril_points');
            if (saved) {
                points = JSON.parse(saved);
                renderPoints();
            }
            updateStats();
        }
        
        function savePoints() {
            localStorage.setItem('aratoril_points', JSON.stringify(points));
        }
        
        function renderPoints() {
            markersLayer.clearLayers();
            
            points.forEach(p => {
                const icon = L.divIcon({
                    className: 'scroll-marker',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                
                L.marker([p.lat, p.lng], { icon })
                    .bindPopup(`Свиток Рассвета<br><small>${new Date(p.time).toLocaleString('ru')}</small>`)
                    .addTo(markersLayer);
            });
        }
        
        function updateStats() {
            const count = points.length;
            document.getElementById('pointsCount').textContent = count;
            
            // Простая формула "силы тумана"
            // Чем больше точек — тем слабее туман (минимум 15%)
            let fog = Math.max(15, 100 - count * 3);
            document.getElementById('fogPercent').textContent = fog + '%';
            
            const status = document.getElementById('fogStatus');
            if (fog > 80) {
                status.textContent = 'Туман плотно лежит над Араторилом...';
            } else if (fog > 50) {
                status.textContent = 'Мгла начинает редеть в некоторых районах';
            } else if (fog > 30) {
                status.textContent = 'Свет пробивается! Туман отступает';
            } else {
                status.textContent = 'Рассвет близок. Туман почти рассеян!';
            }
        }
        
        function addCurrentLocation() {
            const btn = document.getElementById('addPointBtn');
            btn.disabled = true;
            btn.textContent = 'Определяем местоположение...';
            
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается');
                btn.disabled = false;
                btn.textContent = '📍 Оставить Свиток здесь';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    
                    points.push({
                        lat,
                        lng,
                        time: Date.now()
                    });
                    
                    savePoints();
                    renderPoints();
                    updateStats();
                    
                    map.setView([lat, lng], 16);
                    
                    btn.disabled = false;
                    btn.textContent = '📍 Оставить Свиток здесь';
                    
                    // Можно отправить данные обратно в бота
                    if (tg) {
                        // tg.sendData(JSON.stringify({ action: 'add_point', lat, lng }));
                    }
                },
                (err) => {
                    alert('Не удалось получить геолокацию. Разреши доступ к местоположению.');
                    btn.disabled = false;
                    btn.textContent = '📍 Оставить Свиток здесь';
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
        
        // Старт
        loadPoints();
        
        // Центрируем на Армавире при открытии
        map.setView(ARATORIL_CENTER, 14);
    </script>
</body>
</html>
